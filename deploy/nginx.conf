# /etc/nginx/sites-available/jawabbadel -> symlink into sites-enabled, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d jawabbadel.com -d www.jawabbadel.com
server {
    listen 80;
    listen [::]:80;
    server_name jawabbadel.com www.jawabbadel.com;

    # Image uploads are capped at 5MB by the API.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO: WebSocket upgrade and a read timeout longer than its 25s ping interval.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
