<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;box-sizing:border-box}html{overflow:hidden}
body{width:1080px;height:1920px;overflow:hidden;font-family:Tajawal;color:#fff;background:#07071a}
#wrap{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(80% 40% at 50% 10%,#14532ddd,transparent 70%),radial-gradient(90% 45% at 50% 100%,#4c1d95cc,transparent 70%),#07071a}
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(83,252,24,.06) 0 6deg,transparent 6deg 18deg);mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 60%)}
.logo{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:440px}
h1{position:absolute;top:470px;left:30px;right:30px;text-align:center;font:400 112px/1.12 Lalezar;text-shadow:0 10px 0 rgba(0,0,0,.5)}
h1 .g{background:linear-gradient(90deg,#53fc18,#38bdf8);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 0 rgba(0,0,0,.5));text-shadow:none}
.win{position:absolute;left:50px;right:50px;top:800px;height:560px;border-radius:30px;overflow:hidden;border:4px solid #53fc18;box-shadow:0 40px 100px -20px #000,0 0 90px -10px rgba(83,252,24,.7);transform:rotate(-2deg)}
.win img{position:absolute;width:1460px;max-width:none;left:-230px;top:-110px}
.live{position:absolute;top:18px;right:18px;padding:8px 20px;border-radius:12px;background:#e11d48;font:900 36px Tajawal}
.msg{position:absolute;font:900 46px Tajawal;padding:12px 26px;border-radius:22px;background:rgba(14,14,30,.95);border:2px solid rgba(255,255,255,.18);box-shadow:0 20px 50px -10px #000;white-space:nowrap}
.msg b{color:#53fc18}
.badge{position:absolute;font:400 84px/1 Lalezar;padding:18px 40px;border-radius:34px;box-shadow:0 30px 80px -15px #000;white-space:nowrap}
.cta{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);white-space:nowrap;font:900 60px Tajawal;padding:30px 60px;border-radius:40px;background:linear-gradient(90deg,#53fc18,#a3e635);color:#062006;box-shadow:0 30px 90px -10px #53fc18}
</style></head><body><div id="wrap">
<div class="bg"></div><div class="rays"></div>
<img class="logo" src="assets/wordmark-t.png">
<h1>تخيّل متابعينك<br><span class="g">يشاركونك التحدي!</span></h1>
<div class="win"><img src="shots/duel-castle-3b-hit-0.png"><div class="live">● LIVE</div></div>
<div class="msg" style="left:60px;top:1330px;transform:rotate(-4deg)"><span style="color:#38bdf8">فهد:</span> <b>دخول</b></div>
<div class="msg" style="left:400px;top:1410px;transform:rotate(3deg)"><span style="color:#f472b6">سارة:</span> <b>2</b></div>
<div class="msg" style="right:60px;top:1330px;transform:rotate(5deg)"><span style="color:#f7c948">نواف:</span> <b>دخول</b></div>
<div class="badge" style="left:50%;top:1520px;transform:translateX(-50%) rotate(-3deg);background:linear-gradient(135deg,#7c3aed,#be185d)">⚔️ تحدي القنوات</div>
<div class="cta">🎮 جرّبها في بثك الحين</div>
</div></body></html>
