<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{--bg:#07071a;--gold:#f7c948;--orange:#ff6b35;--cyan:#38bdf8;--purple:#a855f7;--pink:#f472b6;--green:#27ae60;--red:#e74c3c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Tajawal,sans-serif;color:#fff}
  .layer{position:absolute;inset:0}
  #bg{background:radial-gradient(80% 45% at 70% 8%,#2a1460 0%,transparent 65%),radial-gradient(80% 45% at 20% 100%,#06284a 0%,transparent 65%),var(--bg)}
  .glyph{position:absolute;font-family:Lalezar;color:#fff;opacity:.05;white-space:nowrap}
  .phone{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:64px;padding:16px;background:linear-gradient(145deg,#2b2b45,#0c0c1c 40%,#1d1d34);box-shadow:0 70px 140px -30px rgba(0,0,0,.95),0 0 0 2px rgba(255,255,255,.14),0 0 140px -30px rgba(168,85,247,.6)}
  .phone .scr{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#07071a}
  .phone .scr img{position:absolute;left:0;top:0;width:390px;height:844px}
  .phone .island{position:absolute;left:50%;top:26px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:5}
  .cap{position:absolute;left:60px;right:60px;text-align:center;font:400 92px/1.15 Lalezar;text-shadow:0 8px 0 rgba(0,0,0,.5)}
  .cap small{display:block;font:800 44px/1.4 Tajawal;color:#ffffffd8;text-shadow:none;margin-top:10px}
  .grad{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45))}
  .gold{background:linear-gradient(90deg,var(--orange),var(--gold));-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45))}
  .stamp{position:absolute;padding:22px 48px;border-radius:34px;font:400 110px/1 Lalezar;white-space:nowrap;box-shadow:0 30px 90px -20px rgba(0,0,0,.9)}
  .finger{position:absolute;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 12px rgba(255,255,255,.25),0 14px 40px rgba(0,0,0,.6);transform:translate(-50%,-50%)}
  .ripple{position:absolute;border-radius:50%;border:8px solid #fff;transform:translate(-50%,-50%)}
  .ring{position:absolute;border-radius:20px;border:6px solid var(--gold);box-shadow:0 0 0 8px rgba(247,201,72,.2),0 0 50px rgba(247,201,72,.7)}
  .tile{position:absolute;left:90px;right:90px;height:250px;border-radius:44px;display:flex;align-items:center;gap:34px;padding:0 50px;background:linear-gradient(160deg,rgba(30,27,75,.96),rgba(15,15,40,.96));border:2px solid rgba(255,255,255,.14);box-shadow:0 50px 100px -25px rgba(0,0,0,.95)}
  .tile .i{font-size:120px;line-height:1}
  .tile .h{font:400 70px/1.1 Lalezar}
  .tile .d{font:800 36px/1.35 Tajawal;opacity:.85}
  .cta{position:absolute;left:50%;padding:34px 64px;border-radius:40px;white-space:nowrap;font:900 66px Tajawal;background:linear-gradient(90deg,var(--orange),var(--gold));color:#140a00;box-shadow:0 30px 90px -10px rgba(255,138,60,.9)}
  .conf{position:absolute;width:22px;height:36px;border-radius:5px}
  .flash{position:absolute;inset:0;background:#fff;pointer-events:none}
  .vignette{position:absolute;inset:0;background:radial-gradient(130% 85% at 50% 50%,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
</style>
</head>
<body>
<script src="data.js"></script>
<div id="stage" class="layer">
  <div id="bg" class="layer"></div>
  <div id="glyphs" class="layer"></div>
  <div id="scenes" class="layer"></div>
  <div id="fx" class="layer"></div>
  <div class="vignette"></div>
</div>
<script>
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
  io: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  out: (k) => 1 - Math.pow(1 - k, 3),
  back: (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: (k) => (k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
};
const P = (t, a, d, e = ease.out) => e(clamp((t - a) / d));
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const SHOTS = window.SHOTS;
const EVENTS = [];
const cue = (t, s, v = 1) => EVENTS.push({ t: +t.toFixed(3), s, v });
const scenes = [];
function scene(key, start, len, build) {
  const root = el('div', 'layer', document.getElementById('scenes'));
  const s = { key, start, end: start + len, len, root };
  s.update = build(s, root);
  scenes.push(s);
}
// A phone holding several real screens (crossfaded by weight).
function phone(root, names) {
  const ph = el('div', 'phone', root);
  const scr = el('div', 'scr', ph);
  el('div', 'island', ph);
  const imgs = {};
  for (const n of names) { const im = el('img', null, scr); im.src = `shots/${n}.jpg`; im.style.opacity = 0; imgs[n] = im; }
  return {
    show(w) { for (const n of names) imgs[n].style.opacity = w[n] || 0; },
    // screen point (px,py) lands on (tx,ty) at scale s
    focus(px, py, s, tx, ty, o = 1, rz = 0) { ph.style.transform = `translate(${tx - (px + 16) * s}px,${ty - (py + 16) * s}px) scale(${s}) rotate(${rz}deg)`; ph.style.opacity = o; },
    screen: (px, py, s, tx, ty) => [tx - (px + 16) * s + (px + 16) * s, 0],
  };
}
// Where a box of a shot lands on the stage, for the phone placed with focus(px,py,s,tx,ty).
const at = (name, key, f) => { const b = SHOTS[name].boxes[key]; const cx = b.x + b.w / 2, cy = b.y + b.h / 2; return [f.tx + (cx - f.px) * f.s, f.ty + (cy - f.py) * f.s, b.w * f.s, b.h * f.s]; };

// ---------- background: floating game words ----------
const glyphs = ['جاوب', 'بادل', 'صح', 'غلط', 'دبل', 'نقاط', '🔄', '✅'].flatMap((w, i) => [0, 1, 2].map((k) => {
  const g = el('div', 'glyph', document.getElementById('glyphs'), w);
  return { g, x: ((i * 7 + k * 13) % 17) / 17 * W, y: ((i * 11 + k * 5) % 19) / 19 * H, s: 60 + ((i + k) % 4) * 30, v: 30 + ((i * 3 + k) % 5) * 12 };
}));
function bgUpdate(t) { for (const q of glyphs) { q.g.style.fontSize = q.s + 'px'; q.g.style.transform = `translate(${q.x}px,${((q.y - t * q.v) % (H + 200) + H + 200) % (H + 200) - 200}px)`; } }

// ---------- scenes ----------
scene('intro', 0, 3.2, (s, root) => {
  const logo = el('img', null, root); logo.src = 'assets/wordmark-t.png'; Object.assign(logo.style, { position: 'absolute', width: '820px', left: '130px', top: '260px' });
  const t1 = el('div', 'cap', root, '<span class="grad">لعبة الأسئلة اللي</span><br><span class="gold">تقلب الجلسة!</span>'); t1.style.top = '1180px'; t1.style.fontSize = '104px';
  cue(0.1, 'riser'); cue(2.72, 'impact'); cue(2.75, 'sparkle');
  return (t) => {
    // Visible from the very first frame (the post's thumbnail), then it settles in with a little bounce.
    const k = P(t, 0, 1.1, ease.back);
    logo.style.transform = `scale(${lerp(0.82, 1, k)}) rotate(${lerp(-8, 0, k)}deg)`; logo.style.opacity = 1;
    const k2 = P(t, 1.2, 0.7, ease.back);
    t1.style.opacity = t < 0.05 ? 1 : P(t, 1.2, 0.3); t1.style.transform = `translateY(${lerp(80, 0, k2)}px) scale(${lerp(0.9, 1, k2) + (t > 2.72 ? 0.06 * Math.exp(-(t - 2.72) * 6) : 0)})`;
  };
});

scene('question', 3.2, 4.6, (s, root) => {
  const cap = el('div', 'cap', root, 'يطلع السؤال للفريقين<small>وكل فريق يختار <b style="color:#f7c948">سرًا</b>: يجاوب أو يبادل!</small>'); cap.style.top = '120px';
  const ph = phone(root, ['a-choose', 'a-swapped']);
  const fing = el('div', 'finger', root), rip = el('div', 'ripple', root);
  const st = el('div', 'stamp', root, '🔄 بادل!'); st.style.background = 'linear-gradient(135deg,#e74c3c,#c0392b)';
  cue(3.25, 'whoosh'); cue(5.55, 'click'); cue(5.75, 'stamp');
  return (t) => {
    const lt = t - s.start;
    const z = lerp(1.95, 2.25, P(lt, 0, 4.6, ease.io));
    const f = { px: 195, py: 300, s: z, tx: W / 2, ty: 1180 };
    ph.focus(f.px, f.py, f.s, f.tx, f.ty, P(lt, 0, 0.35), lerp(-4, 0, P(lt, 0, 0.8, ease.back)));
    ph.show(lt < 2.5 ? { 'a-choose': 1 } : { 'a-choose': 1 - P(lt, 2.5, 0.3), 'a-swapped': P(lt, 2.5, 0.3) });
    cap.style.opacity = P(lt, 0.2, 0.4); cap.style.transform = `translateY(${lerp(-40, 0, P(lt, 0.2, 0.5))}px)`;
    const [x, y] = at('a-choose', 'swap', f);
    fing.style.left = x + 'px'; fing.style.top = lerp(y + 400, y, P(lt, 1.4, 0.8, ease.io)) + 'px';
    fing.style.opacity = lt > 1.3 && lt < 2.45 ? 1 : 0;
    const r = P(lt, 2.35, 0.5); rip.style.left = x + 'px'; rip.style.top = y + 'px'; rip.style.width = rip.style.height = lerp(40, 260, r) + 'px'; rip.style.opacity = lt > 2.35 ? 1 - r : 0;
    const k = P(lt, 2.55, 0.45, ease.back); st.style.opacity = P(lt, 2.55, 0.15); st.style.left = '50%'; st.style.top = '1500px';
    st.style.transform = `translate(-50%,0) rotate(-6deg) scale(${lerp(2.2, 1, k)})`;
  };
});

scene('answer', 7.8, 3.8, (s, root) => {
  const cap = el('div', 'cap', root, 'والفريق الثاني يجاوب<small>«ما هي عاصمة الإمارات؟»</small>'); cap.style.top = '120px';
  const ph = phone(root, ['b-options']);
  const fing = el('div', 'finger', root), rip = el('div', 'ripple', root), ring = el('div', 'ring', root);
  cue(7.85, 'whoosh'); cue(9.7, 'click'); cue(9.8, 'pop');
  return (t) => {
    const lt = t - s.start;
    const f = { px: 195, py: 470, s: 2.05, tx: W / 2, ty: 1330 };
    ph.focus(f.px, f.py, f.s, lerp(W / 2 + 900, W / 2, P(lt, 0, 0.6, ease.out)), f.ty);
    f.tx = lerp(W / 2 + 900, W / 2, P(lt, 0, 0.6, ease.out));
    ph.show({ 'b-options': 1 });
    cap.style.opacity = P(lt, 0.2, 0.4);
    const [x, y, bw, bh] = at('b-options', 'opts', f);
    ring.style.left = x - bw / 2 - 10 + 'px'; ring.style.top = y - bh / 2 - 10 + 'px'; ring.style.width = bw + 20 + 'px'; ring.style.height = bh + 20 + 'px';
    ring.style.opacity = P(lt, 1.9, 0.2); ring.style.transform = `scale(${lerp(1.3, 1, P(lt, 1.9, 0.4, ease.back))})`;
    fing.style.left = x + 'px'; fing.style.top = lerp(y + 380, y, P(lt, 0.9, 0.8, ease.io)) + 'px'; fing.style.opacity = lt > 0.8 && lt < 1.95 ? 1 : 0;
    const r = P(lt, 1.85, 0.5); rip.style.left = x + 'px'; rip.style.top = y + 'px'; rip.style.width = rip.style.height = lerp(40, 260, r) + 'px'; rip.style.opacity = lt > 1.85 ? 1 - r : 0;
  };
});

scene('result', 11.6, 4.8, (s, root) => {
  const cap = el('div', 'cap', root, 'جوابهم صح؟<br><span class="gold">والمبادلة تاخذ دبل! 🔥</span>'); cap.style.top = '110px';
  const ph = phone(root, ['a-result']);
  const st = el('div', 'stamp', root, '+400'); st.style.background = 'linear-gradient(135deg,#27ae60,#1e8449)'; st.style.direction = 'ltr'; st.style.fontSize = '160px';
  const conf = Array.from({ length: 70 }, (_, i) => { const c = el('div', 'conf', root); c.style.background = ['#f7c948', '#ff6b35', '#38bdf8', '#a855f7', '#27ae60', '#f472b6'][i % 6]; return { c, x: (i * 37) % W, d: 0.6 + ((i * 13) % 10) / 10, v: 700 + ((i * 29) % 600), r: (i * 47) % 360 }; });
  const fl = el('div', 'flash', root);
  cue(11.65, 'whoosh'); cue(12.6, 'impact'); cue(12.65, 'ding'); cue(12.8, 'sparkle');
  return (t) => {
    const lt = t - s.start;
    const z = lerp(2.05, 2.25, P(lt, 0, 4.8, ease.io));
    ph.focus(195, 330, z, W / 2, 1150, P(lt, 0, 0.3));
    ph.show({ 'a-result': 1 });
    cap.style.opacity = P(lt, 0.1, 0.35);
    const k = P(lt, 1.0, 0.5, ease.back); st.style.opacity = P(lt, 1.0, 0.1); st.style.left = '50%'; st.style.top = '1470px';
    st.style.transform = `translate(-50%,0) rotate(-5deg) scale(${lerp(2.6, 1, k) + 0.04 * Math.sin(lt * 6)})`;
    fl.style.opacity = lt > 1.0 ? 0.55 * Math.exp(-(lt - 1.0) * 7) : 0;
    for (const q of conf) { const u = lt - 1.0 - q.d * 0.3; q.c.style.opacity = u > 0 ? 1 : 0; q.c.style.transform = `translate(${q.x + Math.sin(u * 3 + q.r) * 60}px,${-60 + Math.max(0, u) * q.v * 0.6}px) rotate(${q.r + u * 400}deg)`; }
  };
});

scene('twist', 16.4, 3.0, (s, root) => {
  const a = el('div', 'cap', root, 'وإذا كان جوابهم <span style="color:#e74c3c">غلط</span>؟'); a.style.top = '640px'; a.style.fontSize = '110px';
  const b = el('div', 'cap', root, '<span class="gold">تنقص نقاطك!</span>'); b.style.top = '860px'; b.style.fontSize = '130px';
  const c = el('div', 'cap', root, '<small>فكّر زين قبل لا تبادل!</small>'); c.style.top = '1080px';
  cue(16.45, 'whoosh'); cue(17.3, 'hit'); cue(18.0, 'tick');
  return (t) => {
    const lt = t - s.start;
    a.style.opacity = P(lt, 0.1, 0.3); a.style.transform = `translateX(${lerp(300, 0, P(lt, 0.1, 0.5))}px)`;
    const k = P(lt, 0.9, 0.5, ease.back); b.style.opacity = P(lt, 0.9, 0.15); b.style.transform = `scale(${lerp(1.8, 1, k)}) rotate(${Math.sin(lt * 18) * 2 * Math.exp(-(lt - 0.9) * 2)}deg)`;
    c.style.opacity = P(lt, 1.5, 0.4);
  };
});

scene('final', 19.4, 4.0, (s, root) => {
  const cap = el('div', 'cap', root, 'وفي النهاية<br><span class="gold">فريق واحد يفوز! 🏆</span>'); cap.style.top = '110px';
  const ph = phone(root, ['a-final']);
  const conf = Array.from({ length: 90 }, (_, i) => { const c = el('div', 'conf', root); c.style.background = ['#f7c948', '#ff6b35', '#38bdf8', '#a855f7', '#27ae60', '#f472b6'][i % 6]; return { c, x: (i * 41) % W, d: ((i * 13) % 10) / 10, v: 600 + ((i * 29) % 700), r: (i * 47) % 360 }; });
  cue(19.45, 'whoosh'); cue(20.2, 'impact'); cue(20.3, 'sparkle');
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.8, ease.back);
    ph.focus(195, 380, lerp(1.5, 2.05, k), W / 2, 1180, P(lt, 0, 0.25), lerp(8, 0, k));
    ph.show({ 'a-final': 1 });
    cap.style.opacity = P(lt, 0.2, 0.35);
    for (const q of conf) { const u = lt - 0.8 - q.d * 0.6; q.c.style.opacity = u > 0 ? 1 : 0; q.c.style.transform = `translate(${q.x + Math.sin(u * 3 + q.r) * 60}px,${-60 + Math.max(0, u) * q.v * 0.6}px) rotate(${q.r + u * 400}deg)`; }
  };
});

scene('features', 23.4, 4.4, (s, root) => {
  const cap = el('div', 'cap', root, '<span class="grad">العبها بطريقتك</span>'); cap.style.top = '260px'; cap.style.fontSize = '120px';
  const rows = [
    ['👥', 'فريقين أو فردي', 'فريق ضد فريق، أو كل واحد لحاله'],
    ['📺', 'جوال وتلفاز', 'كل لاعب على جواله، والتلفاز يعرض'],
    ['🎮', 'أطوار كثيرة', 'جاوب أو بادل · عدّها · خبّي أو اكشف'],
    ['🔴', 'العبها في البث', 'مع شات Kick، وتحدي القنوات'],
  ].map(([i, h, d], n) => { const tl = el('div', 'tile', root, `<div class="i">${i}</div><div><div class="h">${h}</div><div class="d">${d}</div></div>`); tl.style.top = 520 + n * 290 + 'px'; return tl; });
  cue(23.45, 'whoosh'); rows.forEach((_, n) => cue(23.9 + n * 0.45, 'pop'));
  return (t) => {
    const lt = t - s.start;
    cap.style.opacity = P(lt, 0.05, 0.3); cap.style.transform = `scale(${lerp(1.3, 1, P(lt, 0.05, 0.5, ease.back))})`;
    rows.forEach((r, n) => { const k = P(lt, 0.5 + n * 0.45, 0.55, ease.back); r.style.opacity = P(lt, 0.5 + n * 0.45, 0.2); r.style.transform = `translateX(${lerp(n % 2 ? -900 : 900, 0, k)}px)`; });
  };
});

scene('end', 27.8, 4.2, (s, root) => {
  const logo = el('img', null, root); logo.src = 'assets/wordmark-t.png'; Object.assign(logo.style, { position: 'absolute', width: '760px', left: '160px', top: '220px' });
  const t1 = el('div', 'cap', root, '<span class="gold">العبها مجانًا الحين!</span>'); t1.style.top = '1040px'; t1.style.fontSize = '104px';
  const cta = el('div', 'cta', root, '📱 حمّل التطبيق'); cta.style.top = '1260px';
  const site = el('div', 'cap', root, '<small style="font-size:54px;direction:ltr">jawabbadel.com</small>'); site.style.top = '1480px';
  cue(27.85, 'whoosh'); cue(28.0, 'hit'); cue(28.6, 'sparkle');
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.8, ease.back); logo.style.opacity = P(lt, 0, 0.3); logo.style.transform = `scale(${lerp(0.4, 1, k) + 0.02 * Math.sin(lt * 3)})`;
    t1.style.opacity = P(lt, 0.5, 0.3); t1.style.transform = `translateY(${lerp(60, 0, P(lt, 0.5, 0.5))}px)`;
    const k2 = P(lt, 0.9, 0.5, ease.back); cta.style.opacity = P(lt, 0.9, 0.2); cta.style.transform = `translateX(-50%) scale(${lerp(0.5, 1, k2) * (1 + 0.04 * Math.sin(lt * 5))})`;
    site.style.opacity = P(lt, 1.3, 0.4);
  };
});

const TOTAL = scenes[scenes.length - 1].end;
// ---------- render ----------
function render(t) {
  bgUpdate(t);
  for (const s of scenes) {
    // a short crossfade between scenes
    const on = t >= s.start - 0.25 && t < s.end + 0.25;
    s.root.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const fadeIn = s.start === 0 ? 1 : clamp((t - (s.start - 0.25)) / 0.25);
    const fadeOut = s === scenes[scenes.length - 1] ? 1 : clamp((s.end + 0.25 - t) / 0.25);
    s.root.style.opacity = Math.min(fadeIn, fadeOut);
    s.update(t);
  }
}
window.render = render;
window.TIMELINE = { total: TOTAL, events: EVENTS.sort((a, b) => a.t - b.t), voice: [], scenes: scenes.map((s) => ({ key: s.key, start: s.start, end: s.end })) };
render(0);
</script>
</body>
</html>
