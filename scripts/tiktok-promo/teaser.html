<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;box-sizing:border-box}
html{overflow:hidden}
body{width:1080px;height:1920px;overflow:hidden;font-family:Tajawal;color:#fff;background:#07071a;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(80% 40% at 50% 12%,#4c1d95ee,transparent 70%),radial-gradient(90% 45% at 50% 100%,#0e7490aa,transparent 70%),radial-gradient(50% 30% at 85% 55%,#be185d55,transparent 70%),#07071a}
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(247,201,72,.07) 0 6deg,transparent 6deg 18deg);mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 60%)}
.logo{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:520px}
h1{position:absolute;top:560px;left:30px;right:30px;text-align:center;font:400 128px/1.12 Lalezar;text-shadow:0 10px 0 rgba(0,0,0,.5)}
h1 .g{background:linear-gradient(90deg,#ff6b35,#f7c948);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 0 rgba(0,0,0,.5));text-shadow:none}
.phone{position:absolute;width:400px;border-radius:56px;padding:13px;background:linear-gradient(145deg,#2b2b45,#0c0c1c 40%,#1d1d34);box-shadow:0 60px 120px -20px #000,0 0 0 2px #ffffff22,0 0 120px -20px #a855f7aa}
.phone img{display:block;width:100%;border-radius:44px}
.badge{position:absolute;font:400 104px/1 Lalezar;padding:20px 44px;border-radius:36px;box-shadow:0 30px 80px -15px #000}
.cta{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);white-space:nowrap;font:900 60px Tajawal;padding:30px 60px;border-radius:40px;background:linear-gradient(90deg,#ff6b35,#f7c948);color:#140a00;box-shadow:0 30px 90px -10px #ff8a3c}
</style></head><body><div id="wrap" style="position:absolute;inset:0;overflow:hidden">
<div class="bg"></div><div class="rays"></div>
<img class="logo" src="assets/wordmark-t.png">
<h1>تعتقد معلوماتك<br><span class="g">تكفي للفوز؟</span></h1>
<div class="phone" style="left:80px;top:900px;transform:rotate(-8deg)"><img src="shots/choose.jpg"></div>
<div class="phone" style="left:600px;top:870px;transform:rotate(7deg)"><img src="shots/result.jpg"></div>
<div class="badge" style="left:560px;top:1470px;transform:rotate(-6deg);background:linear-gradient(135deg,#27ae60,#1e8449)"><span style="display:inline-block;direction:ltr;unicode-bidi:bidi-override;font:900 96px Tajawal">+600</span> دبل!</div>
<div class="badge" style="left:90px;top:1500px;transform:rotate(5deg);background:linear-gradient(135deg,#e74c3c,#c0392b);font-size:88px">🔄 بادل؟</div>
<div class="cta">🎮 جرّب التحدي الحين</div>
</div></body></html>
