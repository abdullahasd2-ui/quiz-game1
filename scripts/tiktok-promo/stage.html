<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{--bg:#07071a;--gold:#f7c948;--orange:#ff6b35;--cyan:#38bdf8;--purple:#a855f7;--pink:#f472b6;--green:#27ae60;--red:#e74c3c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Tajawal,sans-serif;color:#fff}
  .layer{position:absolute;inset:0;overflow:hidden}
  #stage{overflow:hidden;contain:paint}
  #bg{background:radial-gradient(80% 45% at 70% 8%,#2a1460 0%,transparent 65%),radial-gradient(80% 45% at 20% 100%,#06284a 0%,transparent 65%),var(--bg)}
  #bgpulse{background:radial-gradient(60% 40% at 50% 50%,rgba(168,85,247,.35),transparent 70%);opacity:0}
  .glyph{position:absolute;font-family:Lalezar;color:#fff;opacity:.05;white-space:nowrap}
  .phone{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:64px;padding:16px;background:linear-gradient(145deg,#2b2b45,#0c0c1c 40%,#1d1d34);box-shadow:0 70px 140px -30px rgba(0,0,0,.95),0 0 0 2px rgba(255,255,255,.14),0 0 140px -30px rgba(168,85,247,.6)}
  .phone .scr{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#07071a}
  .phone .scr img{position:absolute;left:0;top:0;width:390px;height:844px}
  .phone .island{position:absolute;left:50%;top:26px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:5}
  .tv{position:absolute;left:0;top:0;transform-origin:0 0;padding:22px 22px 26px;border-radius:26px;background:linear-gradient(#26263f,#0d0d1e);box-shadow:0 0 0 2px rgba(255,255,255,.12),0 70px 140px -30px rgba(0,0,0,.95),0 0 160px -30px rgba(56,189,248,.55)}
  .tv .scr{position:relative;width:1280px;height:720px;border-radius:8px;overflow:hidden}
  .tv .scr img{position:absolute;inset:0;width:1280px;height:720px}
  .tv .foot{position:absolute;left:50%;bottom:-70px;width:300px;height:70px;margin-left:-150px;background:linear-gradient(#2a2a44,#121224);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
  .cap{position:absolute;z-index:6;left:50px;right:50px;text-align:center;font:400 92px/1.15 Lalezar;text-shadow:0 8px 0 rgba(0,0,0,.5)}
  .cap small{display:block;font:800 46px/1.4 Tajawal;color:#ffffffe0;text-shadow:0 3px 0 rgba(0,0,0,.5);margin-top:12px}
  .grad{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45))}
  .gold{background:linear-gradient(90deg,var(--orange),var(--gold));-webkit-background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45))}
  .stamp{position:absolute;z-index:7;left:50%;padding:22px 48px;border-radius:34px;font:400 110px/1 Lalezar;white-space:nowrap;box-shadow:0 30px 90px -20px rgba(0,0,0,.9)}
  .finger{position:absolute;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 12px rgba(255,255,255,.25),0 14px 40px rgba(0,0,0,.6);transform:translate(-50%,-50%)}
  .ripple{position:absolute;border-radius:50%;border:8px solid #fff;transform:translate(-50%,-50%)}
  .ring{position:absolute;border-radius:22px;border:7px solid var(--gold);box-shadow:0 0 0 9px rgba(247,201,72,.2),0 0 60px rgba(247,201,72,.75)}
  .chip{position:absolute;display:flex;align-items:center;gap:16px;padding:20px 34px;border-radius:999px;font:900 50px Tajawal;white-space:nowrap;background:rgba(15,15,40,.94);border:3px solid rgba(255,255,255,.16);box-shadow:0 24px 60px -15px rgba(0,0,0,.9)}
  .tag{position:absolute;z-index:7;left:50%;padding:16px 40px;border-radius:999px;font:400 72px/1 Lalezar;white-space:nowrap;box-shadow:0 24px 70px -15px rgba(0,0,0,.9)}
  .num{position:absolute;font:400 280px/1 Lalezar;direction:ltr}
  .conf{position:absolute;width:22px;height:36px;border-radius:5px}
  .flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
  .bars{position:absolute;inset:0;pointer-events:none}
  .vignette{position:absolute;inset:0;background:radial-gradient(130% 85% at 50% 50%,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
  .word{display:inline-block}
</style>
</head>
<body>
<script src="data.js"></script>
<div id="stage" class="layer">
  <div id="bg" class="layer"></div>
  <div id="bgpulse" class="layer"></div>
  <div id="glyphs" class="layer"></div>
  <div id="scenes" class="layer"></div>
  <div id="fx" class="layer"><div class="flash" id="flash"></div></div>
  <div class="vignette"></div>
</div>
<script>
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
  io: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  out: (k) => 1 - Math.pow(1 - k, 3),
  out5: (k) => 1 - Math.pow(1 - k, 5),
  back: (k) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
};
const P = (t, a, d, e = ease.out) => e(clamp((t - a) / d));
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const SHOTS = window.SHOTS;
const EVENTS = [];
const cue = (t, s, v = 1) => EVENTS.push({ t: +t.toFixed(3), s, v });
const FLASHES = [];
const flashAt = (t, k = 0.5) => FLASHES.push([t, k]);
const scenes = [];
let cursor = 0;
function scene(key, len, build) {
  const root = el('div', 'layer', document.getElementById('scenes'));
  const s = { key, start: cursor, end: cursor + len, len, root };
  cursor += len;
  s.update = build(s, root, (lt) => s.start + lt);
  scenes.push(s);
}
// A phone with real screens (crossfaded by weight).
function phone(root, names) {
  const ph = el('div', 'phone', root);
  const scr = el('div', 'scr', ph);
  el('div', 'island', ph);
  const imgs = {};
  for (const n of names) { const im = el('img', null, scr); im.src = `shots/${n}.jpg`; im.style.opacity = 0; imgs[n] = im; }
  return {
    el: ph,
    show(w) { for (const n of names) imgs[n].style.opacity = typeof w === 'string' ? (n === w ? 1 : 0) : w[n] || 0; },
    focus(f, o = 1, rz = 0) { ph.style.transform = `translate(${f.tx - (f.px + 16) * f.s}px,${f.ty - (f.py + 16) * f.s}px) scale(${f.s}) rotate(${rz}deg)`; ph.style.opacity = o; },
  };
}
// Where a box of a shot lands on the stage for a phone focused with f.
const at = (name, key, f) => { const b = SHOTS[name].boxes[key]; const cx = b.x + b.w / 2, cy = b.y + b.h / 2; return [f.tx + (cx - f.px) * f.s, f.ty + (cy - f.py) * f.s, b.w * f.s, b.h * f.s]; };
// A finger that comes up and taps, with a ripple.
function tapper(root) {
  const fing = el('div', 'finger', root), rip = el('div', 'ripple', root);
  return (lt, x, y, tTap) => {
    fing.style.left = x + 'px'; fing.style.top = lerp(y + 380, y, P(lt, tTap - 0.85, 0.75, ease.io)) + 'px';
    fing.style.opacity = lt > tTap - 0.9 && lt < tTap + 0.35 ? 1 : 0;
    const r = P(lt, tTap, 0.5); rip.style.left = x + 'px'; rip.style.top = y + 'px'; rip.style.width = rip.style.height = lerp(40, 260, r) + 'px'; rip.style.opacity = lt > tTap ? 1 - r : 0;
  };
}
function ringer(root) {
  const r = el('div', 'ring', root);
  return (x, y, w, h, o, pad = 12) => { r.style.left = x - w / 2 - pad + 'px'; r.style.top = y - h / 2 - pad + 'px'; r.style.width = w + pad * 2 + 'px'; r.style.height = h + pad * 2 + 'px'; r.style.opacity = o; r.style.transform = `scale(${lerp(1.25, 1, ease.back(clamp(o)))})`; };
}
function caption(root, html, top) { const c = el('div', 'cap', root, html); c.style.top = top + 'px'; return c; }
const show = (e, lt, a, d = 0.35, dy = 50) => { const k = P(lt, a, d); e.style.opacity = k; e.style.transform = `translateY(${lerp(dy, 0, ease.out(k))}px)`; };
function confetti(root, n = 80) {
  return Array.from({ length: n }, (_, i) => { const c = el('div', 'conf', root); c.style.background = ['#f7c948', '#ff6b35', '#38bdf8', '#a855f7', '#27ae60', '#f472b6'][i % 6]; return { c, x: (i * 41) % W, d: ((i * 13) % 10) / 10, v: 600 + ((i * 29) % 700), r: (i * 47) % 360 }; });
}
const rain = (list, u0) => { for (const q of list) { const u = u0 - q.d * 0.5; q.c.style.opacity = u > 0 ? 1 : 0; q.c.style.transform = `translate(${q.x + Math.sin(u * 3 + q.r) * 60}px,${-60 + Math.max(0, u) * q.v * 0.7}px) rotate(${q.r + u * 400}deg)`; } };

// ---------- background ----------
const glyphs = ['جاوب', 'بادل', 'صح', 'غلط', 'دبل', 'نقاط', '؟', '100', '500'].flatMap((w, i) => [0, 1, 2].map((k) => {
  const g = el('div', 'glyph', document.getElementById('glyphs'), w);
  return { g, x: ((i * 7 + k * 13) % 17) / 17 * W, y: ((i * 11 + k * 5) % 19) / 19 * H, s: 60 + ((i + k) % 4) * 30, v: 30 + ((i * 3 + k) % 5) * 12 };
}));

// ═════════ 1. Hook ═════════
scene('hook', 2.7, (s, root, T) => {
  const flashes = ['choose', 'options', 'picture', 'board'].map((n, i) => { const im = el('img', null, root); im.src = `shots/${n}.jpg`; Object.assign(im.style, { position: 'absolute', width: '1080px', left: 0, top: 0, filter: 'blur(2px) brightness(.45) saturate(1.3)' }); return im; });
  const words = ['تعتقد', 'معلوماتك', 'تكفي', 'للفوز؟'];
  const box = el('div', 'cap', root); box.style.top = '660px'; box.style.fontSize = '140px'; box.style.lineHeight = '1.1';
  const spans = words.map((w, i) => { const sp = el('span', 'word', box, w); if (i === 3) sp.className = 'word gold'; box.appendChild(document.createTextNode(i === 1 ? ' ' : ' ')); if (i === 1) el('br', null, box); return sp; });
  const times = [0, 0.5, 0.95, 1.45];
  times.forEach((t, i) => { cue(T(t), i === 3 ? 'impact' : 'hit', i === 3 ? 1 : 0.8); flashAt(T(t), i === 3 ? 0.55 : 0.25); });
  cue(T(0.0), 'riser', 0.7);
  return (t) => {
    const lt = t - s.start;
    flashes.forEach((im, i) => { const a = i * 0.62; const on = lt >= a && lt < a + 0.62; im.style.opacity = on ? 1 : 0; im.style.transform = `scale(${lerp(1.25, 1.05, P(lt, a, 0.62))}) rotate(${(i % 2 ? -1 : 1) * 2}deg)`; });
    spans.forEach((sp, i) => { const k = i === 0 ? Math.max(0.55, P(lt, 0, 0.28, ease.back)) : P(lt, times[i], 0.28, ease.back); sp.style.opacity = i === 0 ? 1 : P(lt, times[i], 0.06); sp.style.transform = `scale(${lerp(2.4, 1, k)})`; });
    box.style.transform = `scale(${1 + 0.05 * Math.max(0, lt - 1.45)})`;
  };
});

// ═════════ 2. Logo ═════════
scene('logo', 2.4, (s, root, T) => {
  const logo = el('img', null, root); logo.src = 'assets/wordmark-t.png'; Object.assign(logo.style, { position: 'absolute', width: '860px', left: '110px', top: '330px' });
  const t1 = caption(root, '<span class="grad">لعبة أسئلة جماعية</span><small>فريق ضد فريق · أو كل واحد لحاله</small>', 1250);
  cue(T(0.02), 'impact'); cue(T(0.05), 'sparkle'); flashAt(T(0.02), 0.6);
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.6, ease.back); logo.style.transform = `scale(${lerp(1.8, 1, k)}) rotate(${lerp(8, 0, k)}deg)`; logo.style.opacity = P(lt, 0, 0.08);
    show(t1, lt, 0.55);
  };
});

// ═════════ 3. Home ═════════
scene('home', 4.6, (s, root, T) => {
  const cap = caption(root, 'ادخل <span class="gold">jawabbadel.com</span><small>من المتصفح · أو حمّل تطبيق iPhone</small>', 110);
  const ph = phone(root, ['home-hero', 'home-modes', 'home-modes2']);
  cue(T(0), 'whoosh'); cue(T(2.2), 'whoosh', 0.6);
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.7, ease.back);
    ph.focus({ px: 195, py: 422, s: lerp(1.3, 1.78, k), tx: W / 2, ty: 1180 + lerp(0, -30, P(lt, 2.2, 2)) }, P(lt, 0, 0.2), lerp(-10, 0, k));
    ph.show(lt < 2.2 ? 'home-hero' : lt < 3.5 ? { 'home-hero': 1 - P(lt, 2.2, 0.3), 'home-modes': P(lt, 2.2, 0.3) } : { 'home-modes': 1 - P(lt, 3.5, 0.3), 'home-modes2': P(lt, 3.5, 0.3) });
    show(cap, lt, 0.15);
  };
});

// ═════════ 4. Create: teams or solo, phone or TV ═════════
scene('create', 4.6, (s, root, T) => {
  const cap = caption(root, 'أنشئ غرفة بضغطة<small>👥 فريقين أو 🙋 فردي · 📱 جوال أو 📺 تلفاز</small>', 110);
  const ph = phone(root, ['home-solo']);
  const r1 = ringer(root), r2 = ringer(root), r3 = ringer(root);
  cue(T(0), 'whoosh'); cue(T(1.1), 'pop'); cue(T(1.9), 'pop'); cue(T(2.7), 'pop');
  return (t) => {
    const lt = t - s.start;
    const f = { px: 195, py: 300, s: 2.1, tx: W / 2, ty: 1160 };
    ph.focus(f, P(lt, 0, 0.25)); ph.show('home-solo');
    show(cap, lt, 0.15);
    const [x1, y1, w1, h1] = at('home-solo', 'teams', f); r1(x1, y1, w1, h1, P(lt, 1.1, 0.3));
    const [x2, y2, w2, h2] = at('home-solo', 'solo', f); r2(x2, y2, w2, h2, P(lt, 1.9, 0.3));
    const [x3, y3, w3, h3] = at('home-solo', 'tv', f); r3(x3, y3, w3, h3, P(lt, 2.7, 0.3));
  };
});

// ═════════ 5. Code, QR, join ═════════
scene('join', 5.6, (s, root, T) => {
  const cap = caption(root, 'أصحابك يدخلون بالكود<small>أو يمسحون QR بالكاميرا</small>', 110);
  const a = phone(root, ['lobby-wait']);
  const b = phone(root, ['join']);
  const r1 = ringer(root);
  const tap = tapper(root);
  const tagx = el('div', 'tag', root, 'حتى 10 لاعبين في كل فريق'); tagx.style.background = 'linear-gradient(90deg,#ff6b35,#f7c948)'; tagx.style.color = '#140a00'; tagx.style.fontSize = '64px';
  cue(T(0), 'whoosh'); cue(T(0.9), 'pop'); cue(T(1.7), 'pop'); cue(T(2.4), 'whoosh'); cue(T(4.0), 'click'); cue(T(4.5), 'stamp');
  return (t) => {
    const lt = t - s.start;
    const fa = { px: 195, py: 200, s: lerp(2.2, 1.55, P(lt, 2.3, 0.7, ease.io)), tx: lerp(W / 2, 330, P(lt, 2.3, 0.7, ease.io)), ty: lerp(1000, 1080, P(lt, 2.3, 0.7)) };
    a.focus(fa, P(lt, 0, 0.25), lerp(0, -6, P(lt, 2.3, 0.7))); a.show('lobby-wait');
    if (lt < 2.3) {
      const [x, y, w, h] = at('lobby-wait', lt < 1.7 ? 'code' : 'qr', fa); r1(x, y, w, h, lt < 1.7 ? P(lt, 0.9, 0.3) : P(lt, 1.7, 0.3));
    } else r1(0, 0, 0, 0, 0);
    const fb = { px: 195, py: 500, s: 1.55, tx: lerp(W + 500, 760, P(lt, 2.4, 0.7, ease.out)), ty: 1180 };
    b.focus(fb, P(lt, 2.4, 0.2), lerp(10, 5, P(lt, 2.4, 0.7))); b.show('join');
    const [gx, gy] = at('join', 'go', fb); tap(lt, gx, gy, 4.0);
    show(cap, lt, 0.15);
    const k = P(lt, 4.5, 0.4, ease.back); tagx.style.opacity = P(lt, 4.5, 0.1); tagx.style.top = '1690px'; tagx.style.transform = `translateX(-50%) rotate(-3deg) scale(${lerp(2, 1, k)})`;
  };
});

// ═════════ 6. Teams ═════════
scene('teams', 3.4, (s, root, T) => {
  const cap = caption(root, '<span class="gold">فريق ضد فريق!</span><small>الأعضاء يصوّتون، ورئيس الفريق يقرر</small>', 110);
  const ph = phone(root, ['lobby-full']);
  const v = phone(root, ['member-vote']);
  cue(T(0), 'whoosh'); cue(T(1.6), 'whoosh', 0.6);
  return (t) => {
    const lt = t - s.start;
    ph.focus({ px: 195, py: 330, s: 1.9, tx: lerp(W / 2, 360, P(lt, 1.5, 0.6, ease.io)), ty: 1150 }, P(lt, 0, 0.25)); ph.show('lobby-full');
    v.focus({ px: 195, py: 330, s: 1.5, tx: lerp(W + 500, 770, P(lt, 1.6, 0.6, ease.out)), ty: 1250 }, P(lt, 1.6, 0.2), 6); v.show('member-vote');
    show(cap, lt, 0.15);
  };
});

// ═════════ 7. Categories ═════════
scene('cats', 5.6, (s, root, T) => {
  const cap = caption(root, 'اختاروا الفئات<small>من 3 إلى 9 فئات في اللوحة</small>', 110);
  const ph = phone(root, ['cats-top', 'cats']);
  const names = [['🏺', 'تاريخ'], ['🗺️', 'جغرافيا'], ['⚽', 'كرة قدم'], ['🚩', 'أعلام دول'], ['🚗', 'سيارات'], ['🧩', 'مسيرة لاعب'], ['🔍', 'اكتشف الصورة'], ['🔎', 'اكتشف الزوم'], ['👜', 'براندات']];
  const chips = names.map(([i, n]) => el('div', 'chip', root, `<span>${i}</span>${n}`));
  const time = el('div', 'tag', root, '⏱️ وقت القرار: 30 · 45 · 60 ثانية'); time.style.background = 'rgba(15,15,40,.95)'; time.style.border = '3px solid #f7c948'; time.style.fontSize = '58px';
  cue(T(0), 'whoosh'); names.forEach((_, i) => cue(T(0.5 + i * 0.22), 'pop', 0.6)); cue(T(3.4), 'whoosh'); cue(T(4.2), 'stamp');
  return (t) => {
    const lt = t - s.start;
    ph.focus({ px: 195, py: 420, s: 1.65, tx: W / 2, ty: 1180 }, P(lt, 0, 0.25) * (1 - 0.65 * P(lt, 0.4, 0.4))); ph.show(lt < 3.4 ? 'cats-top' : { 'cats-top': 1 - P(lt, 3.4, 0.3), cats: P(lt, 3.4, 0.3) });
    chips.forEach((c, i) => {
      const a = 0.5 + i * 0.22, k = P(lt, a, 0.45, ease.back);
      const col = i % 2, row = Math.floor(i / 2);
      const x = col ? 560 : 80, y = 470 + row * 150 + (col ? 60 : 0);
      c.style.left = (i === 8 ? 330 : x) + 'px'; c.style.top = (i === 8 ? 470 + 4 * 150 + 30 : y) + 'px';
      c.style.opacity = P(lt, a, 0.12) * (1 - P(lt, 3.2, 0.3));
      c.style.transform = `scale(${lerp(0.3, 1, k)}) rotate(${(i % 2 ? 1 : -1) * lerp(14, 0, k)}deg)`;
    });
    show(cap, lt, 0.15);
    const k = P(lt, 4.2, 0.4, ease.back); time.style.opacity = P(lt, 4.2, 0.1); time.style.top = '1700px'; time.style.transform = `translateX(-50%) scale(${lerp(1.8, 1, k)})`;
  };
});

// ═════════ 8. Board ═════════
scene('board', 4.8, (s, root, T) => {
  const cap = caption(root, 'اختاروا السؤال<small>كل ما زادت النقاط… صعب السؤال!</small>', 110);
  const ph = phone(root, ['board']);
  const nums = [100, 200, 300, 400, 500].map((n) => { const e = el('div', 'num', root, n); return e; });
  const tap = tapper(root);
  cue(T(0), 'whoosh'); [0, 1, 2, 3, 4].forEach((i) => cue(T(0.8 + i * 0.4), 'tick', 0.7 + i * 0.1)); cue(T(3.9), 'click');
  return (t) => {
    const lt = t - s.start;
    const f = { px: 195, py: 330, s: 2.05, tx: W / 2, ty: 1160 };
    ph.focus(f, P(lt, 0, 0.25)); ph.show('board');
    nums.forEach((e, i) => {
      const a = 0.8 + i * 0.4, on = lt >= a && lt < a + 0.55;
      e.style.opacity = on ? 1 - P(lt, a + 0.3, 0.25) : 0;
      e.style.left = '50%'; e.style.top = '760px';
      e.style.color = ['#27ae60', '#3b82f6', '#f7c948', '#ff6b35', '#e74c3c'][i];
      e.style.transform = `translateX(-50%) scale(${lerp(0.6, 1.1, P(lt, a, 0.3, ease.back))})`;
      e.style.textShadow = '0 12px 0 rgba(0,0,0,.55)';
    });
    const [x, y] = at('board', 'cell', f); tap(lt, x, y, 3.9);
    show(cap, lt, 0.15);
  };
});

// ═════════ 9. The secret choice ═════════
scene('choose', 6.0, (s, root, T) => {
  const cap = caption(root, 'كل فريق يختار <span class="gold">سرًا</span><small>✅ جاوب بنفسك · أو 🔄 بادل جواب الخصم</small>', 110);
  const ph = phone(root, ['choose', 'swapped']);
  const tap = tapper(root);
  const st = el('div', 'stamp', root, '🔄 بادل!'); st.style.background = 'linear-gradient(135deg,#e74c3c,#c0392b)';
  cue(T(0), 'whoosh'); cue(T(3.0), 'click'); cue(T(3.2), 'stamp');
  return (t) => {
    const lt = t - s.start;
    const f = { px: 195, py: 330, s: lerp(2.05, 2.3, P(lt, 0, 6, ease.io)), tx: W / 2, ty: 1180 };
    ph.focus(f, P(lt, 0, 0.25)); ph.show(lt < 3.0 ? 'choose' : { choose: 1 - P(lt, 3.0, 0.25), swapped: P(lt, 3.0, 0.25) });
    const [x, y] = at('choose', 'swap', f); tap(lt, x, y, 3.0);
    show(cap, lt, 0.15);
    const k = P(lt, 3.2, 0.45, ease.back); st.style.opacity = P(lt, 3.2, 0.12); st.style.top = '1560px'; st.style.transform = `translateX(-50%) rotate(-6deg) scale(${lerp(2.2, 1, k)})`;
  };
});

// ═════════ 10. The answer and the timer ═════════
scene('answer', 5.0, (s, root, T) => {
  const cap = caption(root, 'والخصم يجاوب<small>⏱️ 30 ثانية للإجابة… والوقت يركض!</small>', 110);
  const ph = phone(root, ['options']);
  const rt = ringer(root);
  cue(T(0), 'whoosh'); [0.6, 1.1, 1.6, 2.1].forEach((x) => cue(T(x), 'tick', 0.9));
  return (t) => {
    const lt = t - s.start;
    // Close on the timer first, then pull back to the options.
    const z = P(lt, 2.3, 0.8, ease.io);
    const tb = SHOTS.options.boxes.timer;
    const f = { px: lerp(tb.x + tb.w / 2, 195, z), py: lerp(tb.y + tb.h / 2 + 60, 330, z), s: lerp(2.7, 2.05, z), tx: W / 2, ty: lerp(1000, 1180, z) };
    ph.focus(f, P(lt, 0, 0.25)); ph.show('options');
    const [x, y, w, h] = at('options', 'timer', f); rt(x, y, w, h, P(lt, 0.4, 0.3) * (1 - P(lt, 2.2, 0.3)), 6);
    show(cap, lt, 0.15);
  };
});

// ═════════ 11. Result: double ═════════
scene('result', 5.0, (s, root, T) => {
  const cap = caption(root, 'جوابهم صح؟<br><span class="gold">المبادلة تاخذ دبل! 🔥</span>', 100);
  const ph = phone(root, ['result']);
  const st = el('div', 'stamp', root, '+600'); st.style.background = 'linear-gradient(135deg,#27ae60,#1e8449)'; st.style.direction = 'ltr'; st.style.fontSize = '170px';
  const conf = confetti(root, 70);
  cue(T(0), 'whoosh'); cue(T(1.0), 'impact'); cue(T(1.05), 'ding'); cue(T(1.2), 'sparkle'); flashAt(T(1.0), 0.55);
  return (t) => {
    const lt = t - s.start;
    ph.focus({ px: 195, py: 380, s: lerp(2.0, 2.2, P(lt, 0, 5, ease.io)), tx: W / 2, ty: 1180 }, P(lt, 0, 0.25)); ph.show('result');
    show(cap, lt, 0.1);
    const k = P(lt, 1.0, 0.5, ease.back); st.style.opacity = P(lt, 1.0, 0.1); st.style.top = '1480px'; st.style.transform = `translateX(-50%) rotate(-5deg) scale(${lerp(2.6, 1, k) + 0.04 * Math.sin(lt * 6)})`;
    rain(conf, lt - 1.0);
  };
});

// ═════════ 12. The twist ═════════
scene('twist', 2.6, (s, root, T) => {
  const a = caption(root, 'وإذا جوابهم <span style="color:#e74c3c">غلط</span>؟', 660); a.style.fontSize = '120px';
  const b = caption(root, '<span class="gold">تنقص نقاطك!</span>', 880); b.style.fontSize = '150px';
  const c = caption(root, '<small>فكّر زين قبل لا تبادل</small>', 1110);
  cue(T(0), 'whoosh'); cue(T(0.8), 'hit');
  return (t) => {
    const lt = t - s.start;
    a.style.opacity = P(lt, 0.05, 0.25); a.style.transform = `translateX(${lerp(300, 0, P(lt, 0.05, 0.45))}px)`;
    const k = P(lt, 0.8, 0.45, ease.back); b.style.opacity = P(lt, 0.8, 0.12); b.style.transform = `scale(${lerp(1.8, 1, k)}) rotate(${Math.sin(lt * 18) * 2 * Math.exp(-Math.max(0, lt - 0.8) * 2)}deg)`;
    c.style.opacity = P(lt, 1.3, 0.35);
  };
});

// ═════════ 13. Picture questions ═════════
scene('picture', 4.6, (s, root, T) => {
  const cap = caption(root, 'أسئلة صور<small>الصورة مغبّشة… وتنكشف مع النتيجة</small>', 110);
  const ph = phone(root, ['picture', 'picture-result']);
  cue(T(0), 'whoosh'); cue(T(2.4), 'sparkle'); flashAt(T(2.4), 0.4);
  return (t) => {
    const lt = t - s.start;
    ph.focus({ px: 195, py: 300, s: lerp(2.3, 2.1, P(lt, 0, 4.6)), tx: W / 2, ty: 1160 }, P(lt, 0, 0.25));
    ph.show(lt < 2.4 ? 'picture' : { picture: 1 - P(lt, 2.4, 0.3), 'picture-result': P(lt, 2.4, 0.3) });
    show(cap, lt, 0.15);
  };
});

// ═════════ 14. Streak (motion graphics) ═════════
scene('streak', 3.0, (s, root, T) => {
  const cap = caption(root, '3 أجوبة صح ورا بعض', 420); cap.style.fontSize = '110px';
  const ticks = [0, 1, 2].map((i) => { const e = el('div', 'num', root, i < 2 ? '✅' : '🔥'); e.style.fontSize = '230px'; e.style.top = '760px'; e.style.left = 150 + i * 290 + 'px'; return e; });
  const res = caption(root, '<span class="gold">= الثالث دبل!</span>', 1150); res.style.fontSize = '150px';
  const sub = caption(root, '<small>وكل جواب صح يزيد 🔥 تحت نقاط فريقك</small>', 1380);
  cue(T(0), 'whoosh'); [0.4, 0.8, 1.2].forEach((x, i) => cue(T(x), i === 2 ? 'impact' : 'ding', i === 2 ? 1 : 0.7)); flashAt(T(1.2), 0.45);
  return (t) => {
    const lt = t - s.start;
    show(cap, lt, 0.05);
    ticks.forEach((e, i) => { const k = P(lt, 0.4 + i * 0.4, 0.35, ease.back); e.style.opacity = P(lt, 0.4 + i * 0.4, 0.08); e.style.transform = `scale(${lerp(2.5, 1, k) * (i === 2 ? 1 + 0.06 * Math.sin(lt * 10) : 1)})`; });
    const k = P(lt, 1.35, 0.4, ease.back); res.style.opacity = P(lt, 1.35, 0.1); res.style.transform = `scale(${lerp(1.7, 1, k)})`;
    show(sub, lt, 1.8);
  };
});

// ═════════ 15. The modes ═════════
const MODES = [
  ['flip-choose', '🔀 جاوب أو اقلب', 'اقلب على الخصم: جوابه صح تنقص نقاطه', '#a855f7'],
  ['triple-choose', '↩️ جاوب أو بادل أو اعكس', 'ثلاث خيارات، والعكس يقلب النتيجة عليك', '#f7c948'],
  ['list-play', '⏱️ عدّها', 'الفريقين يكتبون أكثر عدد أجوبة', '#f472b6'],
  ['solo-swap', '🙋 فردي', 'كل واحد لحاله، وتبادل مع اللاعب اللي تختاره', '#38bdf8'],
];
scene('modes', 6.9, (s, root, T) => {
  const head = caption(root, '<span class="grad">أطوار كثيرة!</span>', 80); head.style.fontSize = '110px';
  const items = MODES.map(([shot, title, desc, color]) => {
    const ph = phone(root, [shot]);
    const tg = el('div', 'tag', root, title); tg.style.background = 'rgba(10,10,30,.95)'; tg.style.border = `4px solid ${color}`; tg.style.color = color;
    const d = caption(root, `<small style="margin:0">${desc}</small>`, 1750);
    return { ph, tg, d, shot };
  });
  const per = 1.6;
  items.forEach((_, i) => { cue(T(0.2 + i * per), 'whoosh', 0.8); cue(T(0.45 + i * per), 'pop'); flashAt(T(0.2 + i * per), 0.2); });
  return (t) => {
    const lt = t - s.start;
    head.style.opacity = P(lt, 0, 0.25);
    items.forEach((it, i) => {
      const a = 0.2 + i * per, u = lt - a;
      const on = u > -0.1 && (i === items.length - 1 || u < per + 0.15);
      const last = i === items.length - 1;
      const enter = P(lt, a, 0.4, ease.out), leave = last ? 0 : P(lt, a + per - 0.25, 0.35, ease.io);
      const dir = i % 2 ? -1 : 1;
      it.ph.focus({ px: 195, py: 422, s: 1.6, tx: W / 2 + dir * lerp(1100, 0, enter) - dir * lerp(0, 1100, leave), ty: 1120 }, on ? 1 : 0, dir * lerp(12, 0, enter));
      it.ph.show(it.shot);
      const k = P(lt, a + 0.2, 0.35, ease.back); it.tg.style.opacity = on ? P(lt, a + 0.2, 0.1) * (1 - leave) : 0; it.tg.style.top = '280px'; it.tg.style.transform = `translateX(-50%) scale(${lerp(1.6, 1, k)})`;
      it.d.style.opacity = on ? P(lt, a + 0.35, 0.2) * (1 - leave) : 0;
    });
  };
});

// ═════════ 16. TV ═════════
scene('tv', 4.4, (s, root, T) => {
  const cap = caption(root, 'العبوها على <span class="gold">التلفاز</span><small>التلفاز يعرض السؤال، والفريقين على جوالاتهم</small>', 110);
  const tv = el('div', 'tv', root); const scr = el('div', 'scr', tv); el('div', 'foot', tv);
  const imgs = ['tv-board', 'tv-question'].map((n) => { const im = el('img', null, scr); im.src = `shots/${n}.jpg`; return im; });
  const a = phone(root, ['choose']), b = phone(root, ['options']);
  cue(T(0), 'whoosh'); cue(T(2.0), 'whoosh', 0.6);
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.7, ease.back);
    const sc = 0.78;
    tv.style.transform = `translate(${W / 2 - (1324 * sc) / 2}px,${lerp(900, 640, k)}px) scale(${sc}) perspective(1800px) rotateX(${lerp(20, 4, k)}deg)`;
    tv.style.opacity = P(lt, 0, 0.2);
    imgs[0].style.opacity = lt < 2.0 ? 1 : 1 - P(lt, 2.0, 0.3); imgs[1].style.opacity = P(lt, 2.0, 0.3);
    a.focus({ px: 195, py: 422, s: 0.62, tx: lerp(-300, 250, P(lt, 1.2, 0.5, ease.back)), ty: 1520 }, P(lt, 1.2, 0.2), -8); a.show('choose');
    b.focus({ px: 195, py: 422, s: 0.62, tx: lerp(W + 300, 830, P(lt, 1.4, 0.5, ease.back)), ty: 1520 }, P(lt, 1.4, 0.2), 8); b.show('options');
    show(cap, lt, 0.15);
  };
});

// ═════════ 17. The winner ═════════
scene('final', 4.0, (s, root, T) => {
  const cap = caption(root, 'وفي النهاية<br><span class="gold">فريق واحد يفوز! 🏆</span>', 100);
  const ph = phone(root, ['final']);
  const conf = confetti(root, 100);
  cue(T(0), 'whoosh'); cue(T(0.7), 'impact'); cue(T(0.8), 'sparkle'); flashAt(T(0.7), 0.5);
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.8, ease.back);
    ph.focus({ px: 195, py: 300, s: lerp(1.5, 2.1, k), tx: W / 2, ty: 1180 }, P(lt, 0, 0.25), lerp(8, 0, k)); ph.show('final');
    show(cap, lt, 0.2);
    rain(conf, lt - 0.7);
  };
});

// ═════════ 18. End: logo + QR ═════════
scene('end', 6.4, (s, root, T) => {
  const logo = el('img', null, root); logo.src = 'assets/wordmark-t.png'; Object.assign(logo.style, { position: 'absolute', width: '560px', left: '260px', top: '130px' });
  const qrBox = el('div', null, root); Object.assign(qrBox.style, { position: 'absolute', left: '290px', top: '800px', width: '500px', height: '500px', background: '#fff', borderRadius: '40px', padding: '26px', boxShadow: '0 0 0 10px rgba(247,201,72,.9),0 40px 120px -20px rgba(247,201,72,.7)' });
  const qr = el('img', null, qrBox); qr.src = 'assets/qr.svg'; Object.assign(qr.style, { width: '100%', height: '100%', display: 'block' });
  const t1 = caption(root, '<span class="gold">امسح الرمز وابدأ التحدي!</span>', 1380); t1.style.fontSize = '96px';
  const site = caption(root, '<small style="font-size:56px;color:#fff">📱 حمّل التطبيق من App Store</small>', 1560);
  const app = caption(root, '<small style="direction:ltr">jawabbadel.com</small>', 1680);
  cue(T(0), 'whoosh'); cue(T(0.2), 'impact'); cue(T(0.9), 'stamp'); cue(T(1.4), 'sparkle'); flashAt(T(0.2), 0.45);
  return (t) => {
    const lt = t - s.start;
    const k = P(lt, 0, 0.7, ease.back); logo.style.opacity = P(lt, 0, 0.1); logo.style.transform = `scale(${lerp(1.6, 1, k) + 0.015 * Math.sin(lt * 3)})`;
    const k2 = P(lt, 0.8, 0.5, ease.back); qrBox.style.opacity = P(lt, 0.8, 0.1); qrBox.style.transform = `scale(${lerp(0.4, 1, k2)}) rotate(${lerp(-10, 0, k2)}deg)`;
    show(t1, lt, 1.3); show(site, lt, 1.6); show(app, lt, 1.9);
  };
});

const TOTAL = cursor;
// ---------- render ----------
const flashEl = document.getElementById('flash'), pulse = document.getElementById('bgpulse');
function render(t) {
  for (const q of glyphs) { q.g.style.fontSize = q.s + 'px'; q.g.style.transform = `translate(${q.x}px,${((q.y - t * q.v) % (H + 200) + H + 200) % (H + 200) - 200}px)`; }
  let fl = 0;
  for (const [a, k] of FLASHES) if (t >= a) fl = Math.max(fl, k * Math.exp(-(t - a) * 9));
  flashEl.style.opacity = fl;
  pulse.style.opacity = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);
  for (const s of scenes) {
    const on = t >= s.start - 0.2 && t < s.end + 0.2;
    s.root.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const fadeIn = s.start === 0 ? 1 : clamp((t - (s.start - 0.2)) / 0.2);
    const fadeOut = s === scenes[scenes.length - 1] ? 1 : clamp((s.end + 0.2 - t) / 0.2);
    s.root.style.opacity = Math.min(fadeIn, fadeOut);
    s.update(t);
  }
}
window.render = render;
window.TIMELINE = { total: TOTAL, events: EVENTS.sort((a, b) => a.t - b.t), voice: [], scenes: scenes.map((s) => ({ key: s.key, start: s.start, end: s.end })) };
render(0);
</script>
</body>
</html>
